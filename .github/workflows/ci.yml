name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Changes to the workflows themselves run every job.
          filters: |
            workflows: &workflows
              - '.github/workflows/**'
            backend:
              - *workflows
              - 'backend/**'
              # Backend integration tests import the generated fixtures.
              - 'fixtures/**'
            frontend:
              - *workflows
              - 'frontend/**'
            docker:
              - *workflows
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'fixtures/**'
            fixtures:
              - *workflows
              - 'fixtures/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # libvips CLI for the thumbnail tests (same tool as the runtime image).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools && vips --version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: fixtures/generate/requirements.txt
      - name: Generate import fixtures
        working-directory: .
        run: |
          pip install -r fixtures/generate/requirements.txt
          python fixtures/generate/generate.py
      # Testcontainers uses the runner's Docker daemon. vips tests must run (not skip) in CI.
      - run: ./mvnw -B verify
        env:
          KURATOON_TEST_REQUIRE_VIPS: 'true'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Write CI .env and data folders
        run: |
          cp deploy/.env.example deploy/.env
          {
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "IMAGE_SIGNING_SECRET=$(openssl rand -hex 24)"
            # Short windows so the e2e import is picked up quickly.
            echo "IMPORT_POLL_SECONDS=2"
            echo "IMPORT_STABLE_SECONDS=2"
          } >> deploy/.env
          mkdir -p deploy/data/import deploy/data/library deploy/data/data deploy/data/plugins deploy/data/postgres
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: fixtures/generate/requirements.txt
      - name: Import fixture for the e2e import flow
        run: |
          pip install -r fixtures/generate/requirements.txt
          python fixtures/generate/generate.py --case oneshot --out deploy/data/import
      - name: Build images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          # / redirects to /setup on a fresh install; follow it.
          curl -fsSL http://localhost:8080/ | grep -qi kuratoon
          test "$(curl -fsS http://localhost:8080/api/v1/health)" = '{"status":"UP"}'
          # Actuator is internal only: nginx sends /actuator to the frontend, never the backend.
          ! curl -sL http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          # The API needs a login (Problem Details 401 from the backend).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/admin/media-types)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/media/00000000-0000-7000-8000-000000000000)" = 401
          # Fresh database: setup is required.
          curl -fsS http://localhost:8080/api/v1/auth/status | grep -q '"setupRequired":true'
      - name: Permission model (backend umask 027, nginx reads via PGID)
        run: |
          compose="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          $compose exec -T backend sh -c 'grep -q "Umask:.*0027" /proc/1/status'
          $compose exec -T backend sh -c 'umask 027 && mkdir -p /library/.ci && echo ok > /library/.ci/probe'
          test "$(stat -c '%a' deploy/data/library/.ci/probe)" = 640
          test "$($compose exec -T nginx cat /library/.ci/probe)" = ok
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: End-to-end tests (Playwright against the stack)
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v

  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: fixtures/generate/requirements.txt
      - run: pip install -r fixtures/generate/requirements.txt
      - run: python fixtures/generate/check_deterministic.py
